# ------------------------------------------------------------------ #
# Paths                                                               #
# ------------------------------------------------------------------ #
paths:
  checkpoints:
    fastsam:          external/segmast3r/checkpoints/ultralytics/FastSAM-x.pt
    mast3r_retrieval: external/MASt3R-SLAM/checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric_retrieval_trainingfree.pth
    mast3r_original: external/MASt3R-SLAM/checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth
    segmast3r_head: external/segmast3r/checkpoints/heads_only.pt
    clip:           null   # null = auto-download laion2b_s34b_b79k via open_clip
# ------------------------------------------------------------------ #
# Dataset                                                             #
# ------------------------------------------------------------------ #
dataset:
  path:    datasets/tum/rgbd_dataset_freiburg1_desk
  save_as: default
  calib:   ""

# ------------------------------------------------------------------ #
# SLAM                                                                #
# ------------------------------------------------------------------ #
slam:
  config: external/MASt3R-SLAM/config/base.yaml
  no_viz: false

# ------------------------------------------------------------------ #
# Segmentation                                                        #
# backend: fastsam | grounded_sam2                                    #
# ------------------------------------------------------------------ #
# To use FastSAM instead, replace the segmentation block with:
#
# segmentation:
#   backend: fastsam
#   conf:    0.9
#   iou:     0.9
#   imgsz:   702
#
segmentation:
  backend:          grounded_sam2
  sam2_checkpoint:  external/Grounded-SAM-2/checkpoints/sam2.1_hiera_base_plus.pt
  sam2_config:      configs/sam2.1/sam2.1_hiera_b+.yaml
  gdino_checkpoint: external/Grounded-SAM-2/gdino_checkpoints/groundingdino_swint_ogc.pth
  gdino_config:     external/Grounded-SAM-2/grounding_dino/groundingdino/config/GroundingDINO_SwinT_OGC.py
  box_threshold:    0.35
  text_threshold:   0.25

# ------------------------------------------------------------------ #
# Labeling (CLIP keyword matching)                                    #
# ------------------------------------------------------------------ #
labeling:
  keywords_file: configs/keywords.txt
  threshold: 0.25   # min cosine similarity to assign a label; below this → None

# ------------------------------------------------------------------ #
# InstanceTracker                                            #
# ------------------------------------------------------------------ #
instance_tracker:
  merge_weights:
    descriptor: 0.35
    centroid:   0.25
    iou:        0.25
    size:       0.15
    clip:       0.00
  merge_threshold:               0.75
  reattach_threshold:            0.40
  max_centroid_distance:         3.0
  label_mismatch_penalty:        0.1
  label_filter:                  true
  ema_decay:                     0.85
  min_support_count:             2
  skip_resweep:                  false
  candidate_promotion_threshold: 4
  candidate_window_size:         20

visualization:
  # If true, send per-frame instance color overlays to the visualizer.
  # If false, only keyframes include instance overlays (reduces color churn).
  mask_point_colors_every_frame: True
# ------------------------------------------------------------------ #
# Presets                                                             #
# ------------------------------------------------------------------ #
presets:
  quality:
    segmentation:
      conf:  0.3
      iou:   0.4
      imgsz: 1024
    fusion:
      skip_resweep: false

  balanced:
    segmentation:
      conf:  0.3
      iou:   0.4
      imgsz: 768
    fusion:
      skip_resweep: false

  near_realtime:
    segmentation:
      conf:  0.4
      iou:   0.5
      imgsz: 480
    fusion:
      resweep_interval: 0
      skip_resweep:     true