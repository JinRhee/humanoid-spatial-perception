# ------------------------------------------------------------------ #
# Paths                                                               #
# ------------------------------------------------------------------ #
paths:
  checkpoints:
    mast3r_retrieval: external/MASt3R-SLAM/checkpoints/mast3r_v2.pth
    mast3r_original: external/MASt3R-SLAM/checkpoints/mast3r_v1.pth
    segmast3r_head: external/segmast3r/checkpoints/heads_only.pt
# ------------------------------------------------------------------ #
# Dataset                                                             #
# ------------------------------------------------------------------ #
dataset:
  path:    datasets/tum/rgbd_dataset_freiburg1_desk
  save_as: default
  calib:   ""

# ------------------------------------------------------------------ #
# SLAM                                                                #
# ------------------------------------------------------------------ #
slam:
  config: external/MASt3R-SLAM/config/base.yaml
  no_viz: false

# ------------------------------------------------------------------ #
# Segmentation                                                        #
# ------------------------------------------------------------------ #
segmentation:
  backend:          grounded_sam2
  sam2_checkpoint:  external/Grounded-SAM-2/checkpoints/sam2.1_hiera_large.pt
  sam2_config:      configs/sam2.1/sam2.1_hiera_l.yaml
  gdino_checkpoint: external/Grounded-SAM-2/gdino_checkpoints/groundingdino_swint_ogc.pth
  gdino_config:     external/Grounded-SAM-2/grounding_dino/groundingdino/config/GroundingDINO_SwinT_OGC.py
  box_threshold:    0.2
  text_threshold:   0.25

# ------------------------------------------------------------------ #
# Labeling                                                            #
# ------------------------------------------------------------------ #
labeling:
  keywords_file: configs/keywords.txt

# ------------------------------------------------------------------ #
# InstanceTracker                                                     #
# ------------------------------------------------------------------ #
instance_tracker:
  merge_weights:
    descriptor: 0.10
    centroid:   0.40
    overlap:    0.40
    size:       0.10
  merge_threshold:               0.75
  reattach_threshold:            0.40
  max_centroid_distance:         3.0
  label_mismatch_penalty:        0.1
  label_filter:                  true
  ema_decay:                     0.85
  min_support_count:             2
  skip_resweep:                  true
  candidate_promotion_threshold: 4
  candidate_window_size:         100

# ------------------------------------------------------------------ #
# Presets                                                             #
# ------------------------------------------------------------------ #
presets:
  quality: {}
  balanced: {}
  near_realtime: {}
